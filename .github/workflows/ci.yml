name: CineBook CI & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automated QA test suites
        run: npm run test:all

      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          CRON_SECRET: "cinebook_cron_secret_token_12345"
          JWT_SECRET: "cinebook_super_secret_jwt_key_min_32_chars_long_change_in_prod"
